<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гончарук Светлана | Прикладная информатика</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #4a3b69);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); 
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #e0bbff; 
            text-shadow: 0 0 10px rgba(224, 187, 255, 0.5); 
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #d1d1d1;
        }

        .logo-container {
            margin-top: 30px;
            background-color: white;
            padding: 15px;
            border-radius: 15px;
            display: inline-block;
            transition: transform 0.3s;
        }
        .logo-container:hover {
            transform: scale(1.05); 
        }

        img {
            width: 150px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Гончарук Светлана ✨</h1>
        <p>Студентка направления «Прикладная информатика».</p>
        <a href="https://rb.asu.ru" target="_blank" class="logo-container">
            <img src="https://rb.asu.ru/public/design/images/logotype/logoRI-2017.png" alt="Логотип АГУ">
        </a>
    </div>

</body>
</html>
